<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>理享厨房预约助手</title>
  <link rel="stylesheet" href="popup.css">
  <script src="rules.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div>
      <p class="campus">浙江理工大学</p>
      <h1>理享厨房预约助手</h1>
    </div>
    <span id="state" class="state">未设置</span>
  </header>

  <main>
    <section class="schedule" aria-labelledby="window-heading">
      <h2 id="window-heading">开机待命</h2>
      <p id="window" class="window">请选择日期、时段和厨房</p>
      <p id="trigger" class="trigger"></p>
      <p class="hint">北京时间。请保持电脑开机、联网，且 Chrome 打开。</p>
      <p id="status" role="status" hidden></p>
    </section>

    <form id="plan-form">
      <fieldset id="settings">
        <legend class="sr-only">预约设置</legend>
        <div class="form-grid">
          <label>预约日期<input id="date" type="date" required></label>
          <label>用餐人数
            <select id="people" aria-label="用餐人数"></select>
          </label>
          <label>时段开始<input id="start" type="time" value="16:00" required></label>
          <label>时段结束<input id="end" type="time" value="18:30" required></label>
        </div>

        <section class="preferences" aria-labelledby="preferences-heading">
          <h2 id="preferences-heading">厨房优先顺序</h2>
          <p class="hint">按列表从上到下寻找可约时段。</p>
          <div class="picker">
            <select id="room" aria-label="选择厨房"></select>
            <button id="add" type="button" class="secondary">加入</button>
          </div>
          <ol id="priority" aria-label="已选厨房优先顺序"></ol>
        </section>

        <label class="consent">
          <input id="authorized" type="checkbox">
          <span>我已阅读站点安全须知，并授权按以上条件提交一次预约。</span>
        </label>
        <label id="verify-previous" class="consent" hidden>
          <input id="checked-previous" type="checkbox">
          <span>我已在「我的预约」核对上次提交结果。</span>
        </label>
      </fieldset>

      <p id="error" role="alert" hidden></p>
      <footer>
        <button id="visit" type="button" class="secondary">打开预约网页</button>
        <button id="begin" type="submit" class="primary">开始预约</button>
        <button id="cancel" type="button" class="secondary stop" hidden>停止任务</button>
      </footer>
    </form>
  </main>
</body>
</html>
